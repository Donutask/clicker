<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just a Clicker</title>
    <meta name="description" content="Click for clicks">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <noscript>Please enable JavaScript</noscript>

    <div id="container">
        <p id="clicks">Clicks</p>
        <button id="button" onclick="Click()">Click</button>
        <button class="underlineButton" id="subtract" onclick="Subtract()">Subtract</button>
    </div>

    <button class="underlineButton" id="options" onclick="OpenOptions()">Options</button>

    <dialog id="optionsModal">
        <h2>Options</h2>
        <div class="optionsLayout">
            <button class="optionsButton" onclick="Rename()">Rename</button>
            <button class="optionsButton" onclick="SetValue()">Set Value</button>
            <button class="optionsButton" onclick="CopyLogs()">Copy Logs</button>
            <button class="optionsButton" onclick="SoftReset()">Reset Count</button>
            <button class="optionsButton" onclick="HardReset()">Delete Everything</button>
            <button class="optionsButton" onclick="CloseOptions()">Close</button>
        </div>
    </dialog>

    <script src="options.js"></script>
    <script src="log.js"></script>
    <script src="main.js"></script>
</body>

</html>
